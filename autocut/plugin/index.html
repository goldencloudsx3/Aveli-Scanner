<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <!-- React root element - REQUIRED for React to mount -->
  <div id="root"></div>

  <!-- Fallback message if JS fails to load -->
  <noscript>
    <p style="color: #e8e8e8; padding: 16px;">
      AutoCut requires JavaScript. Please enable JavaScript and reload.
    </p>
  </noscript>

  <!-- Bundle script - must be run after root element exists -->
  <script src="bundle.js"></script>
</body>
</html>
